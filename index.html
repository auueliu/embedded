<style>
  body { margin: 0; background: black; }

  #loading { position: fixed; top: 40px; left: 50%; transform: translate(-50%,-50%); color: rgba(10,10,10,0.4); font-family: Georgia; font-size: 14px; pointer-events: none; }
</style>
<div id="loading">click a word to explore</div>
<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* global nn */
  
// create a word as a 3D sprite
function makeWordSprite (word) {
  const hue = nn.randomFloat(196, 300)  // color
  const rgb = nn.hsl2rgb(hue, 35, 60)
  const dpr = window.devicePixelRatio
  
  const c = document.createElement('canvas')
  c.width = 2048 * dpr
  c.height = 512 * dpr
  const ctx = c.getContext('2d')
  ctx.scale(dpr, dpr)
  ctx.clearRect(0, 0, 2048, 512)
  ctx.font = 'italic 144px garamond'
  ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 1)`
  ctx.fillText(word, 1024, 256)
  const texture = new THREE.CanvasTexture(c)
  const mat = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
    opacity: 0
  })
  const sprite = new THREE.Sprite(mat)
  sprite.scale.set(2.5, 0.6, 1)
  sprite.userData.word = word
  return sprite
}

// fetch related words from API
async function fetchRelated (word) {
  try {
    const res = await fetch(`https://api.datamuse.com/words?rel_trg=${word}&max=10`)
    const data = await res.json()
    return data
      .slice(0, 10)
      .map(r => r.word)
  } catch (e) {
    return []
  }
}

// place words in a sphere around a center point
function placeAroundPoint (cx, cy, cz, count) {
  const positions = []
  for (let i = 0; i < count; i++) {
    const phi = Math.acos(2 * Math.random() - 1)
    const theta = Math.random() * Math.PI * 2
    const r = nn.randomFloat(2, 3.5)
    positions.push({
      x: cx + r * Math.sin(phi) * Math.cos(theta),
      y: cy + r * Math.sin(phi) * Math.sin(theta),
      z: cz + r * Math.cos(phi)
    })
  }
  return positions
}

function setup () {
  const renderer = new THREE.WebGLRenderer({ antialias: true })
  renderer.setSize(nn.width, nn.height)
  //backgroundcolor
  renderer.setClearColor(0xdeebf7)
  document.body.appendChild(renderer.domElement)

  const scene = new THREE.Scene()
  scene.fog = new THREE.FogExp2(0xdeebf7, 0.1) //fading in the back
  const camera = new THREE.PerspectiveCamera(70, nn.width / nn.height, 0.1, 100)
  camera.position.z = 5

  const count = 12000 // particle numbers
  const geo = new THREE.BufferGeometry()
  const positions = new Float32Array(count * 3)
  const colors = new Float32Array(count * 3)

  for (let i = 0; i < count; i++) {
    positions[i * 3]     = nn.randomFloat(-30, 30)
    positions[i * 3 + 1] = nn.randomFloat(-15, 15)
    positions[i * 3 + 2] = nn.randomFloat(-50, 15)

    // particle color
    const hue = nn.randomFloat(196, 300)
    const rgb = nn.hsl2rgb(hue, 32, 74)
    colors[i * 3]     = rgb.r / 255
    colors[i * 3 + 1] = rgb.g / 255
    colors[i * 3 + 2] = rgb.b / 255
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3))
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3))
  
  // particles
  const mat = new THREE.PointsMaterial({
    size: 0.14,
    vertexColors: true,
  })

  const particles = new THREE.Points(geo, mat)
  scene.add(particles)
  
  // glowing background
  const ellipseCanvas = document.createElement('canvas')
  ellipseCanvas.width = 512
  ellipseCanvas.height = 512

  const ectx = ellipseCanvas.getContext('2d')

  const eGradient = ectx.createRadialGradient(256, 256, 0, 256, 256, 256)
  eGradient.addColorStop(0, 'rgba(255, 150, 180, 0.3)')
  eGradient.addColorStop(0.5, 'rgba(200, 100, 200, 0.08)')
  eGradient.addColorStop(1, 'rgba(0, 0, 0, 0)')

  ectx.fillStyle = eGradient
  ectx.fillRect(0, 0, 512, 512)

  const ellipseTexture = new THREE.CanvasTexture(ellipseCanvas)
  const ellipseMat = new THREE.SpriteMaterial({
    map: ellipseTexture,
    transparent: true,
    depthWrite: false
  })
  const ellipseGlow = new THREE.Sprite(ellipseMat)
  
  ellipseGlow.scale.set(20, 8, 1) //circle shape
  ellipseGlow.position.set(0, 0, -5)
  camera.add(ellipseGlow)  // move with camera
  scene.add(camera)

  // word state
  let wordSprites = []

  // camera fly target
  let targetPos = new THREE.Vector3(0, 0, 5)
  let isFlyingTo = false

  // spawn a word + fetch and place related words around it
  async function spawnWords (word, cx, cy, cz) {
    wordSprites.forEach(s => scene.remove(s))
    wordSprites = []
    const centerSprite = makeWordSprite(word)
    centerSprite.position.set(cx, cy, cz)
    centerSprite.userData.pos = { x: cx, y: cy, z: cz }
    scene.add(centerSprite)
    wordSprites.push(centerSprite)
    let related = []
    try {
      related = await fetchRelated(word)
    } catch (e) {
      document.getElementById('loading').textContent = 'could not fetch words'
      return
    }
    const pts = placeAroundPoint(cx, cy, cz, related.length)
    related.forEach((w, i) => {
      const sprite = makeWordSprite(w)
      sprite.position.set(pts[i].x, pts[i].y, pts[i].z)
      sprite.userData.pos = pts[i]
      scene.add(sprite)
      wordSprites.push(sprite)
    })
    document.getElementById('loading').textContent = 'click a word to explore'
  }

  // click detection
  const raycaster = new THREE.Raycaster()
  const mouse = new THREE.Vector2()
  renderer.domElement.addEventListener('click', async e => {
    mouse.x = (e.clientX / nn.width) * 2 - 1
    mouse.y = -(e.clientY / nn.height) * 2 + 1
    raycaster.setFromCamera(mouse, camera)
    const hits = raycaster.intersectObjects(wordSprites)
    if (hits.length > 0) {
      const clicked = hits[0].object
      const word = clicked.userData.word
      const pos = clicked.userData.pos
      targetPos = new THREE.Vector3(pos.x, pos.y, pos.z + 4)
      isFlyingTo = true
      //await spawnWords(word, pos.x, pos.y, pos.z)
    }
  })

  // start word
  spawnWords('cloud', 0, 0, 0)

  const perlin = nn.perlin()
  perlin.seed()
  let t = 0

  function animate () {
    requestAnimationFrame(animate)

    // fade in word sprites
    wordSprites.forEach(s => {
      if (s.material.opacity < 1) s.material.opacity += 0.02
    })

    // smooth camera fly toward clicked word
    if (isFlyingTo) {
      camera.position.lerp(targetPos, 0.03)
      if (camera.position.distanceTo(targetPos) < 0.1) isFlyingTo = false
    }

    const nx = perlin.get(t * 0.3, 0)
    particles.rotation.x = nn.map(nx, -1, 1, -0.05, 0.05)
    particles.rotation.y += 0.002
    t += 0.01
    renderer.render(scene, camera)
  }

  animate()
}

nn.on('load', setup)
</script>
